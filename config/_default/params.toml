# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/favicon.png"

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[footer]
    since      = 2026
    customText = ""

[dateFormat]
    published   = "2006年01月02日"
    lastUpdated = "2006年01月02日"

[sidebar]
    emoji    = "🌊"
    subtitle = "欢迎来这溜达"
    avatar   = "img/avatar.jpg"

[article]
    headingAnchor = false
    math          = true
    readingTime   = true

    [article.license]
        enabled = true
        default = "本文采用 CC BY-NC-SA 4.0 许可协议"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

## Comments
[comments]
    enabled  = true
    provider = "giscus"

    [comments.giscus]
        repo             = "untitledwave645-debug/untitledwave645-debug.github.io"
        repoID           = "R_kgDOTbatWg"
        category         = "General"
        categoryID       = "DIC_kwDOTbatWs4DJqst"
        mapping          = "pathname"
        strict           = 0
        reactionsEnabled = 1
        emitMetadata     = 0
        inputPosition    = "top"
        lightTheme       = "light_protanopia"
        darkTheme        = "dark_dimmed"
        lang             = "zh-CN"
        loading          = "lazy"
